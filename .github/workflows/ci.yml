name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-tools:
    name: Python 工具自检
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 用合成样本验证 rpf9_probe / rpf_carve / shader_stats / match_texture / analyze_exe
      - run: python tools/selftest_tools.py

  docs-links:
    name: 文档相对链接
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_docs.py

  windows-build:
    name: Windows 构建 + 全套测试（需要 GDK，缺则跳过）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 检查 GDK 头文件是否就位
        id: gdk
        shell: bash
        run: |
          if [ -d ../gdk/include_clean ] && [ -f ../gdk/lib/xgameruntime.lib ]; then
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 没有 GDK —— 明确标记"未覆盖"，不假装通过
        if: steps.gdk.outputs.have == '0'
        shell: bash
        run: |
          echo "::warning::未找到 ../gdk/include_clean 与 ../gdk/lib/xgameruntime.lib，构建步骤未执行"
          {
            echo "### windows-build: 未覆盖（缺 GDK）"
            echo ""
            echo "微软 GDK 头/库不入库，runner 上不存在 \`../gdk/\`。"
            echo "本 job 因此**没有编译过任何 C++**，不能当作构建通过。"
            echo "要真正验证：把 GDK 解到仓库旁的 \`../gdk/\`（见 docs/publish.md）。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 安装 MinGW 与 Vulkan SDK（dxc）
        if: steps.gdk.outputs.have == '1'
        shell: bash
        run: |
          choco install mingw --no-progress -y
          choco install vulkan-sdk --no-progress -y

      - name: 构建
        if: steps.gdk.outputs.have == '1'
        shell: bash
        run: bash ./build.sh

      - name: 全套测试
        if: steps.gdk.outputs.have == '1'
        shell: bash
        run: bash ./tools/run_suite.sh

      - name: 上传测试报告
        if: steps.gdk.outputs.have == '1'
        uses: actions/upload-artifact@v4
        with:
          name: suite-report
          path: build/suite/
          if-no-files-found: ignore
