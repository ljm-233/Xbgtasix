name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-tools:
    name: Python 工具自检
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 用合成样本验证 rpf9_probe / rpf_carve / shader_stats / match_texture / analyze_exe
      - run: python tools/selftest_tools.py

  docs-links:
    name: 文档相对链接
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_docs.py

  windows-build:
    name: Windows 构建 + 测试
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 MinGW 与 Vulkan SDK（dxc）
        shell: bash
        run: |
          # chocolatey 的 CDN 偶发 504（实测遇到一次），装不上就会导致没有 dxc、
          # 进而 build.sh 按新断言直接失败。这里重试 3 次并显式报告结果。
          retry() {
            local what="$1"; shift
            for i in 1 2 3; do
              echo "== $what（第 $i 次）"
              if "$@"; then return 0; fi
              echo "   失败，15 秒后重试"
              sleep 15
            done
            echo "::error::$what 连续 3 次失败"
            return 1
          }
          retry "安装 MinGW" choco install mingw --no-progress -y
          retry "安装 Vulkan SDK" choco install vulkan-sdk --no-progress -y
          echo "/c/ProgramData/mingw64/mingw64/bin" >> "$GITHUB_PATH"
          # 把 dxc 的实际位置打出来：以后找不到时能一眼看出是路径还是没装上
          echo "== dxc 位置"
          ls -1 /c/VulkanSDK/*/Bin/dxc.exe 2>/dev/null || echo "（/c/VulkanSDK 下没有 dxc）"
          command -v dxc || true

      - name: 缓存 GDK nupkg
        uses: actions/cache@v4
        with:
          path: build/gdk/_pkg
          key: gdk-nuget-2610.0.9661

      - name: 从 NuGet 拉官方 GDK（解出头文件与导入库）
        shell: bash
        run: |
          mkdir -p build/gdk/_pkg
          python tools/fetch_gdk.py --out build/gdk

      - name: 检测 GDK 是否可用
        shell: bash
        run: |
          # 只负责把 GDK_INC 传给后面的步骤，不做"降级"判断：
          # 拿不到 GDK 时由 STRICT=1 的 ci_build.sh 判失败（以前这里算了 have 却没人消费，
          # 于是缺 GDK 的构建照样绿）。
          if [ -f "build/gdk/include_clean/XTaskQueue.h" ] && [ -f "build/gdk/lib/xgameruntime.lib" ]; then
            echo "GDK_INC=build/gdk/include_clean" >> "$GITHUB_ENV"
            echo "HAVE_GDK=1" >> "$GITHUB_ENV"
            echo "GDK 可用：build/gdk/include_clean"
          else
            echo "HAVE_GDK=0" >> "$GITHUB_ENV"
            echo "::error::未找到 GDK（build/gdk/include_clean/XTaskQueue.h 或 build/gdk/lib/xgameruntime.lib 缺失）"
            echo "windows-build 不再静默降级为「部分覆盖」：下一步 STRICT=1 会直接失败。"
            echo "如何提供 GDK：① 让 '从 NuGet 拉官方 GDK' 步骤成功（tools/fetch_gdk.py）；"
            echo "              ② 或把 GDK 解到仓库旁 ../gdk/include_clean；"
            echo "              ③ 或设 GDK_INC 指向 include_clean 目录。"
          fi

      - name: 构建 + 测试（tools/ci_build.sh，STRICT=1）
        shell: bash
        run: STRICT=1 bash ./tools/ci_build.sh

      - name: 覆盖率说明
        if: always()
        shell: bash
        run: |
          # 测试步数从 tools/run_suite.sh 现数（run_one + run_py 的调用行），别再写死"32 项"
          SUITE_STEPS=$(grep -cE '^[[:space:]]*run_(one|py)[[:space:]]' tools/run_suite.sh 2>/dev/null || true)
          SUITE_STEPS=${SUITE_STEPS:-0}
          {
            echo "### windows-build 覆盖范围"
            echo ""
            if [ -f "build/gdk/include_clean/XTaskQueue.h" ]; then   # 用文件判断，别用 step output
              echo "- ✅ GDK 可用：三个 shim + 全套 ${SUITE_STEPS} 步测试（STRICT=1，缺 GDK 会让 job 失败）"
            else
              echo "- ❌ 未找到 GDK：本 job **按失败处理**（STRICT=1），不再当作「部分覆盖通过」"
              echo "- 微软 GDK 头/库不入库，所以本 job 里没有编译 xgameruntime/、d3d12_xs，也没跑渲染类测试。"
              echo "- 要覆盖完整层：让 \`python tools/fetch_gdk.py --out build/gdk\` 成功，"
              echo "  或把 GDK 解到仓库旁 \`../gdk/\`，或设 \`GDK_INC\` 指向 include_clean。"
              echo "- 只想到此为止地跑第 1 层（xmem.dll + t3_xmem），本地用 \`bash ./tools/ci_build.sh\`（不带 STRICT）。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            build/suite/
            build/ci_*.log
            build/xbgtasix.log
          if-no-files-found: ignore

  linux-cross:
    name: Linux 交叉编译（Arch 路径的构建环节）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 mingw-w64 交叉编译器
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-mingw-w64-x86-64

      - name: 从 NuGet 拉官方 GDK
        run: python tools/fetch_gdk.py --out ../gdk

      - name: 交叉编译三个 shim
        run: |
          CXX=x86_64-w64-mingw32-g++ GDK_INC=../gdk/include_clean \
            bash ./tools/build_linux_cross.sh

      - name: 校验产物（导出数必须与 Windows 构建一致）
        run: |
          python - <<'PY'
          import struct, sys

          def exports(path):
              d = open(path, "rb").read()
              e = struct.unpack_from("<I", d, 0x3C)[0]
              if d[e:e+4] != b"PE\0\0":
                  return -1
              nsec = struct.unpack_from("<H", d, e+6)[0]
              optsz = struct.unpack_from("<H", d, e+20)[0]
              opt = e + 24
              plus = struct.unpack_from("<H", d, opt)[0] == 0x20B
              dd = opt + (112 if plus else 96)
              exp_rva = struct.unpack_from("<I", d, dd)[0]
              sec = opt + optsz
              def off(rva):
                  for i in range(nsec):
                      o = sec + i * 40
                      vs, va, rs, ra = struct.unpack_from("<IIII", d, o + 8)
                      if va <= rva < va + max(vs, rs):
                          return ra + (rva - va)
                  return None
              eo = off(exp_rva)
              if eo is None:
                  return 0
              return struct.unpack_from("<I", d, eo + 24)[0]

          want = {"xgameruntime.dll": 461, "xmem.dll": 4, "d3d12_xs.dll": 18}
          bad = 0
          for name, expect in want.items():
              got = exports("build/linux/" + name)
              ok = got == expect
              print(f"{name:20s} 导出 {got:4d}  期望 {expect:4d}  {'OK' if ok else 'MISMATCH'}")
              if not ok:
                  bad += 1
          sys.exit(1 if bad else 0)
          PY
