name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-tools:
    name: Python 工具自检
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 用合成样本验证 rpf9_probe / rpf_carve / shader_stats / match_texture / analyze_exe
      - run: python tools/selftest_tools.py

  docs-links:
    name: 文档相对链接
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_docs.py

  windows-build:
    name: Windows 构建 + 测试
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 MinGW 与 Vulkan SDK（dxc）
        shell: bash
        run: |
          choco install mingw --no-progress -y
          choco install vulkan-sdk --no-progress -y
          echo "/c/ProgramData/mingw64/mingw64/bin" >> "$GITHUB_PATH"

      - name: 缓存 GDK nupkg
        uses: actions/cache@v4
        with:
          path: build/gdk/_pkg
          key: gdk-nuget-2610.0.9661

      - name: 从 NuGet 拉官方 GDK（解出头文件与导入库）
        shell: bash
        run: |
          mkdir -p build/gdk/_pkg
          python tools/fetch_gdk.py --out build/gdk

      - name: 检测 GDK 是否可用
        id: gdk
        shell: bash
        run: |
          if [ -f "build/gdk/include_clean/XTaskQueue.h" ] && [ -f "build/gdk/lib/xgameruntime.lib" ]; then
            echo "have=1" >> "$GITHUB_OUTPUT"
            echo "GDK_INC=build/gdk/include_clean" >> "$GITHUB_ENV"
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建 + 测试（tools/ci_build.sh）
        shell: bash
        run: ./tools/ci_build.sh

      - name: 覆盖率说明
        shell: bash
        run: |
          {
            echo "### windows-build 覆盖范围"
            echo ""
            if [ -f "build/gdk/include_clean/XTaskQueue.h" ]; then   # 用文件判断，别用 step output
              echo "- ✅ GDK 可用：三个 shim + 全套 32 项测试"
            else
              echo "- ⚠️ 未找到 GDK：跑了 xmem.dll + t3_xmem（93 条断言）+ 工具自检 + 文档链接"
              echo "- 微软 GDK 头/库不入库，所以公开 CI 上默认**没有**编译 xgameruntime/"
              echo "  d3d12_xs，也**没有**跑渲染类测试。这不是完整通过。"
              echo "- 要覆盖完整层：把 GDK 解到仓库旁 \`../gdk/\`，或设 \`GDK_INC\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            build/suite/
            build/ci_*.log
            build/xbgtasix.log
          if-no-files-found: ignore

  linux-cross:
    name: Linux 交叉编译（Arch 路径的构建环节）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 mingw-w64 交叉编译器
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-mingw-w64-x86-64

      - name: 从 NuGet 拉官方 GDK
        run: python tools/fetch_gdk.py --out ../gdk

      - name: 交叉编译三个 shim
        run: |
          CXX=x86_64-w64-mingw32-g++ GDK_INC=../gdk/include_clean \
            ./tools/build_linux_cross.sh

      - name: 校验产物（导出数必须与 Windows 构建一致）
        run: |
          python - <<'PY'
          import struct, sys

          def exports(path):
              d = open(path, "rb").read()
              e = struct.unpack_from("<I", d, 0x3C)[0]
              if d[e:e+4] != b"PE\0\0":
                  return -1
              nsec = struct.unpack_from("<H", d, e+6)[0]
              optsz = struct.unpack_from("<H", d, e+20)[0]
              opt = e + 24
              plus = struct.unpack_from("<H", d, opt)[0] == 0x20B
              dd = opt + (112 if plus else 96)
              exp_rva = struct.unpack_from("<I", d, dd)[0]
              sec = opt + optsz
              def off(rva):
                  for i in range(nsec):
                      o = sec + i * 40
                      vs, va, rs, ra = struct.unpack_from("<IIII", d, o + 8)
                      if va <= rva < va + max(vs, rs):
                          return ra + (rva - va)
                  return None
              eo = off(exp_rva)
              if eo is None:
                  return 0
              return struct.unpack_from("<I", d, eo + 24)[0]

          want = {"xgameruntime.dll": 461, "xmem.dll": 4, "d3d12_xs.dll": 18}
          bad = 0
          for name, expect in want.items():
              got = exports("build/linux/" + name)
              ok = got == expect
              print(f"{name:20s} 导出 {got:4d}  期望 {expect:4d}  {'OK' if ok else 'MISMATCH'}")
              if not ok:
                  bad += 1
          sys.exit(1 if bad else 0)
          PY
